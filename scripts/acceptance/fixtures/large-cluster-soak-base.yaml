apiVersion: v1
kind: Namespace
metadata:
  name: __NAMESPACE__
  labels:
    aiops.strato.io/fixture: large-cluster-soak
    aiops.strato.io/run-id: __RUN_ID__
  annotations:
    aiops.strato.io/expires-at: "__EXPIRES_AT__"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: large-cluster-soak
  namespace: __NAMESPACE__
  labels:
    aiops.strato.io/fixture: large-cluster-soak
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: __RBAC_NAME__
  labels:
    aiops.strato.io/fixture: large-cluster-soak
    aiops.strato.io/run-id: __RUN_ID__
rules:
  - apiGroups: [""]
    resources:
      - namespaces
      - pods
      - pods/log
      - services
      - endpoints
      - configmaps
      - secrets
      - serviceaccounts
      - events
      - persistentvolumeclaims
      - persistentvolumes
      - resourcequotas
      - limitranges
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: __RBAC_NAME__
  labels:
    aiops.strato.io/fixture: large-cluster-soak
    aiops.strato.io/run-id: __RUN_ID__
subjects:
  - kind: ServiceAccount
    name: large-cluster-soak
    namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: __RBAC_NAME__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-source
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: log-source
    aiops.strato.io/fixture: large-cluster-soak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: log-source
  template:
    metadata:
      labels:
        app.kubernetes.io/name: log-source
        aiops.strato.io/fixture: large-cluster-soak
    spec:
      automountServiceAccountToken: false
      containers:
        - name: logger
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'while true; do echo "large-cluster-soak heartbeat"; sleep 2; done'
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
