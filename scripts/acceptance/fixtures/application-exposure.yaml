  namespace: klueops-exposure-acceptance
  labels:
    aiops.strato.io/fixture: application-exposure
spec:
  gatewayClassName: klueops-acceptance
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
