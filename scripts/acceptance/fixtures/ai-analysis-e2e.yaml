    aiops.strato.io/expires-at: "__EXPIRES_AT__"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-analysis-acceptance
  namespace: __NAMESPACE__
  labels:
    aiops.strato.io/fixture: ai-analysis-e2e
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
