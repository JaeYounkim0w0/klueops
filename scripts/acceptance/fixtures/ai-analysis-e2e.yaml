subjects:
  - kind: ServiceAccount
    name: ai-analysis-acceptance
    namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ai-analysis-acceptance
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-port-failure
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: privileged-port-failure
    aiops.strato.io/fixture: ai-analysis-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: privileged-port-failure
  template:
    metadata:
      labels:
        app.kubernetes.io/name: privileged-port-failure
        aiops.strato.io/fixture: ai-analysis-e2e
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - 'echo "bind() to 0.0.0.0:80 failed (13: Permission denied)" >&2; sleep 1; exit 1'
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-backend
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: service-backend
    aiops.strato.io/fixture: ai-analysis-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: service-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: service-backend
        aiops.strato.io/fixture: ai-analysis-e2e
    spec:
      automountServiceAccountToken: false
      containers:
        - name: web
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/httpd", "-f", "-p", "8080", "-h", "/tmp"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 1
            periodSeconds: 2
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: service-backend
  namespace: __NAMESPACE__
  labels:
    aiops.strato.io/fixture: ai-analysis-e2e
spec:
  selector:
    app.kubernetes.io/name: service-backend
  ports:
    - name: http
      port: 80
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rollout-target
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: rollout-target
    aiops.strato.io/fixture: ai-analysis-e2e
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: rollout-target
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rollout-target
        aiops.strato.io/fixture: ai-analysis-e2e
    spec:
      automountServiceAccountToken: false
      containers:
        - name: worker
          image: busybox:1.36.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "sleep 3600"]
          env:
            - name: RELEASE_MARKER
              value: revision-1
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
