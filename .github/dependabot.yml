version: 2

updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      backend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: maven
    directory: /command-runner
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      command-runner-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    groups:
      frontend-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /command-runner
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /keycloak
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
