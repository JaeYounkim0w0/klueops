name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Install Playwright Chromium
        run: npx --prefix frontend playwright install --with-deps chromium
      - name: Install Helm
        uses: azure/setup-helm@v4
      - name: Install repository validation tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Validate KlueOps quality gate
        run: ./scripts/validate-release-candidate.sh
      - name: Upload redacted evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: klueops-quality-evidence
          path: |
            artifacts/rc
            artifacts/sbom
            artifacts/supply-chain
            frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 14
