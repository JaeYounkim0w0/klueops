name: supply-chain

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Generate runtime SBOMs
        run: ./scripts/generate-sbom.sh
      - name: Validate dependency licenses
        run: ./scripts/validate-dependency-licenses.sh
      - name: Audit production frontend dependencies
        run: npm --prefix frontend audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v7
        with:
          name: klueops-runtime-sboms
          path: artifacts/sbom
          retention-days: 14

  container-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: keycloak
            context: keycloak
          - component: command-runner
            context: command-runner
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          load: true
          tags: klueops-scan/${{ matrix.component }}:${{ github.sha }}
      - name: Scan runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: klueops-scan/${{ matrix.component }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate runtime image SBOM
        if: always()
        uses: anchore/sbom-action@v0
        with:
          image: klueops-scan/${{ matrix.component }}:${{ github.sha }}
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ matrix.component }}-runtime-sbom
          path: ${{ matrix.component }}.spdx.json
          retention-days: 14
