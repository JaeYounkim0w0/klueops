name: signed-klueops-containers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend
          - component: frontend
            context: frontend
          - component: keycloak
            context: keycloak
          - component: command-runner
            context: command-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/klueops-${{ matrix.component }}
          tags: |
            type=ref,event=tag
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          load: true
          push: false
          tags: klueops-build/${{ matrix.component }}:candidate
      - name: Block High and Critical runtime vulnerabilities
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: klueops-build/${{ matrix.component }}:candidate
          format: sarif
          output: trivy-${{ matrix.component }}.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: klueops-build/${{ matrix.component }}:candidate
          format: spdx-json
          output-file: ${{ matrix.component }}.spdx.json
      - id: publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
      - name: Sign immutable image digest
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/klueops-${{ matrix.component }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.component }}-supply-chain-evidence
          path: |
            ${{ matrix.component }}.spdx.json
            trivy-${{ matrix.component }}.sarif
          retention-days: 30
