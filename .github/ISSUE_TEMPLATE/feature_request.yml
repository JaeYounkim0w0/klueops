name: Feature request
description: Propose a focused improvement to KlueOps
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Explain the operational problem before proposing an implementation. KlueOps prioritizes evidence-guided Kubernetes operations, explicit safety boundaries, and deployer-controlled integrations.
  - type: checkboxes
    id: preparation
    attributes:
      label: Preparation
      options:
        - label: I searched existing issues and documentation for this capability.
          required: true
        - label: I have not included credentials, customer data, or private incident evidence.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Operational problem
      description: Who has the problem, in what workflow, and what evidence shows it matters?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the desired behavior and acceptance criteria. Implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Security, data, and compatibility impact
      description: Note RBAC, tenant isolation, Kubernetes mutation, AI data flow, API/UI contracts, and deployment implications.
    validations:
      required: true
