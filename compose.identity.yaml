name: aiops-identity-dev

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${AIOPS_KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${AIOPS_KEYCLOAK_ADMIN_PASSWORD:?AIOPS_KEYCLOAK_ADMIN_PASSWORD is required}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${AIOPS_KEYCLOAK_PORT:-18080}:8080"
    volumes:
      - aiops-keycloak-dev-data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  aiops-keycloak-dev-data:
