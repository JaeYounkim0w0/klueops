name: aiops-rc

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${AIOPS_DB_NAME:-aiops}
      POSTGRES_USER: ${AIOPS_DATASOURCE_USERNAME:-raguser}
      POSTGRES_PASSWORD: ${AIOPS_DATASOURCE_PASSWORD:?AIOPS_DATASOURCE_PASSWORD is required}
    ports:
      - "127.0.0.1:${AIOPS_COMPOSE_DB_PORT:-15432}:5432"
    volumes:
      - aiops-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${AIOPS_BACKEND_PROFILES:-postgres,security-oidc}
      AIOPS_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${AIOPS_DB_NAME:-aiops}
      AIOPS_DATASOURCE_USERNAME: ${AIOPS_DATASOURCE_USERNAME:-raguser}
      AIOPS_DATASOURCE_PASSWORD: ${AIOPS_DATASOURCE_PASSWORD:?AIOPS_DATASOURCE_PASSWORD is required}
      AIOPS_LOCAL_MASTER_KEY: ${AIOPS_LOCAL_MASTER_KEY:?AIOPS_LOCAL_MASTER_KEY is required}
      AIOPS_AI_BASE_URL: ${AIOPS_AI_BASE_URL:-http://host.docker.internal:11434}
      AIOPS_AI_MODEL: ${AIOPS_AI_MODEL:-qwen2.5-coder:7b}
      AIOPS_CREDENTIAL_REVEAL_ENABLED: "false"
      AIOPS_VALIDATION_LAB_LIVE_ENABLED: "false"
      AIOPS_OIDC_ISSUER_URI: ${AIOPS_OIDC_ISSUER_URI:-}
      AIOPS_OIDC_CLIENT_ID: ${AIOPS_OIDC_CLIENT_ID:-}
      AIOPS_OIDC_CLIENT_SECRET: ${AIOPS_OIDC_CLIENT_SECRET:-}
      AIOPS_SESSION_COOKIE_SECURE: ${AIOPS_SESSION_COOKIE_SECURE:-true}
      AIOPS_SESSION_TIMEOUT: ${AIOPS_SESSION_TIMEOUT:-30m}
      AIOPS_SESSION_ABSOLUTE_TIMEOUT: ${AIOPS_SESSION_ABSOLUTE_TIMEOUT:-8h}
    ports:
      - "127.0.0.1:${AIOPS_BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${AIOPS_FRONTEND_PORT:-8088}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  aiops-postgres-data:
