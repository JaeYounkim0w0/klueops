{{- if and .Values.portal.enabled .Values.portal.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aiops.fullname" . }}-backend
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  minAvailable: {{ .Values.portal.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aiops.fullname" . }}-frontend
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  minAvailable: {{ .Values.portal.pdb.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
{{- end }}
