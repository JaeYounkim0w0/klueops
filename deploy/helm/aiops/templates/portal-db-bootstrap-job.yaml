{{- if and .Values.portal.enabled (eq .Values.postgresql.bootstrapMode "automatic") }}
{{- $bootstrapSecret := required "postgresql.bootstrapExistingSecret is required when bootstrapMode=automatic" .Values.postgresql.bootstrapExistingSecret }}
{{- $runtimeSecret := required "portal.database.runtimeExistingSecret is required" .Values.portal.database.runtimeExistingSecret }}
{{- $host := required "postgresql.host is required when bootstrapMode=automatic" .Values.postgresql.host }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "aiops.fullname" . }}-portal-db-bootstrap
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: portal-db-bootstrap
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-11"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        {{- include "aiops.labels" . | nindent 8 }}
        app.kubernetes.io/component: portal-db-bootstrap
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:17
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
{{ .Files.Get "files/bootstrap-portal-db.sh" | indent 14 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              value: {{ $host | quote }}
            - name: PGPORT
              value: {{ .Values.postgresql.port | quote }}
            - name: PGSSLMODE
              value: {{ .Values.postgresql.sslMode | quote }}
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $bootstrapSecret }}
                  key: password
            - name: PORTAL_DB_NAME
              value: {{ .Values.portal.database.name | quote }}
            - name: PORTAL_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecret }}
                  key: username
            - name: PORTAL_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $runtimeSecret }}
                  key: password
{{- end }}
