{{- if and .Values.portal.enabled .Values.portal.commandRunner.enabled }}
{{- $fullname := include "aiops.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-command-runner
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: command-runner
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-command-runner
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: command-runner
spec:
  selector:
    app.kubernetes.io/name: {{ include "aiops.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: command-runner
  ports:
    - name: http
      port: 8090
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-command-runner
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: command-runner
spec:
  replicas: {{ .Values.portal.commandRunner.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: command-runner
  template:
    metadata:
      labels:
        {{- include "aiops.labels" . | nindent 8 }}
        app.kubernetes.io/component: command-runner
    spec:
      serviceAccountName: {{ $fullname }}-command-runner
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: command-runner
          image: {{ include "aiops.image" .Values.portal.commandRunner.image }}
          imagePullPolicy: {{ .Values.portal.commandRunner.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: AIOPS_RUNNER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.portal.commandRunner.tokenExistingSecret }}
                  key: token
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            failureThreshold: 20
            periodSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
          resources:
            {{- toYaml .Values.portal.commandRunner.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.portal.commandRunner.temporaryStorageLimit }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-command-runner
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "aiops.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: command-runner
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aiops.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: backend
      ports:
        - protocol: TCP
          port: 8090
{{- end }}
