{{- if eq (include "aiops.managedKeycloakEnabled" .) "true" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiops.fullname" . }}-keycloak
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: keycloak
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ include "aiops.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management
      port: 9000
      targetPort: management
{{- end }}

