{{- if .Values.portal.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiops.fullname" . }}-frontend-nginx
  labels:
    {{- include "aiops.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  default.conf: |
    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        server_tokens off;
        client_max_body_size 2m;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'ok';
        }

        location ~ ^/actuator/health/(readiness|liveness)$ {
            access_log off;
            proxy_pass http://{{ include "aiops.fullname" . }}-backend:{{ .Values.portal.backend.service.port }};
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(api/|v3/api-docs|oauth2/|login/oauth2/code/|logout$) {
            proxy_pass http://{{ include "aiops.fullname" . }}-backend:{{ .Values.portal.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 360s;
            proxy_buffering off;
        }

        location /ws/ {
            proxy_pass http://{{ include "aiops.fullname" . }}-backend:{{ .Values.portal.backend.service.port }};
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 910s;
            proxy_buffering off;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control 'public, immutable';
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control 'no-cache';
        }
    }
{{- end }}
